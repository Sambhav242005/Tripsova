services:
  db:
    # PostGIS image (not plain postgres) — the app uses ST_DWithin / geography
    # functions for nearby search. The postgis extension is enabled by the
    # initial Alembic migration.
    # Build locally — prebuilt postgis/postgis images lack ARM64 variants for v16.
    # This Dockerfile starts from postgres:16-bookworm (native ARM64) and installs
    # postgis via apt.
    build:
      context: .
      dockerfile: Dockerfile.postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tripova
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/tripova
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-72}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://tripsova.sambhav-surana.online}
      DEBUG: ${DEBUG:-false}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
    # No host port mapping — access the API through the nginx proxy (port 80).
    # Exposing backend directly was causing HTTPS→HTTP private-IP requests.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Cold start on a fresh pgdata volume waits for Postgres, retries the first
      # connection, then runs Alembic migrations before uvicorn serves /health.
      # Give that a realistic window; start_interval probes often so compose
      # flips to healthy quickly once it's actually up (not on the 30s interval).
      start_period: 120s
      start_interval: 5s
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      # NOTE: deliberately NO NEXT_PUBLIC_API_URL build arg. The browser talks to
      # the API through nginx on the same origin via RELATIVE URLs. Baking a host
      # here (e.g. a LAN IP from deploy/.env) freezes it into the client JS and
      # triggers the browser's Local Network Access prompt. The Dockerfile pins it
      # to empty so this can't happen.
    # No host port mapping — the frontend is reachable only inside the compose
    # network, exclusively through the nginx reverse proxy (ports 80/443). nginx
    # proxies `location /` to frontend:5173 via Docker DNS, so nothing needs to be
    # published to the host. `expose` documents the internal port without opening
    # it on the host (unlike `ports:`, which previously bound host :5174).
    expose:
      - "5173"
    environment:
      # Server-side only (SSR / metadata fetches). Never reaches the browser.
      API_URL_INTERNAL: ${API_URL_INTERNAL:-http://backend:8010}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    # Reverse proxy. Routes all traffic (port 80/443) — serves frontend and
    # proxies /api/ to backend. This avoids HTTPS→HTTP private-IP requests
    # that trigger the Local Network Access browser permission popup.
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
