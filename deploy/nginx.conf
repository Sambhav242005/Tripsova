# Tripsova reverse proxy.
#
# Routes the public site + API through one host and terminates TLS.
# Nginx is always started (no profile flag needed).
#
# Out of the box this serves plain HTTP on :80 (works immediately). To enable
# HTTPS, drop certificates into deploy/certs/ (fullchain.pem + privkey.pem) and
# uncomment the redirect + the TLS server block below.

worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    server_tokens off;
    client_max_body_size 10m;

    # Resolve upstreams via Docker's embedded DNS (127.0.0.11) at REQUEST time,
    # not at startup. A static `upstream { server frontend:5173; }` block makes
    # nginx resolve the name once while parsing config — if the frontend/backend
    # container isn't registered in Docker DNS yet, nginx exits with
    # "host not found in upstream" and crash-loops. Using a variable in
    # proxy_pass forces lazy, per-request resolution so nginx boots regardless of
    # start order and recovers on its own.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Shared proxy headers.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- HTTP (:80) -------------------------------------------------------
    server {
        listen 80;
        server_name tripsova.sambhav-surana.online;

        # To force HTTPS once certs are in place, comment out the two location
        # blocks below and uncomment this redirect:
        # return 301 https://$host$request_uri;

        location /api/ {
            set $tripsova_backend backend:8010;
            proxy_pass http://$tripsova_backend;
        }
        location / {
            set $tripsova_frontend frontend:5173;
            proxy_pass http://$tripsova_frontend;
        }
    }

    # ---- HTTPS (:443) — uncomment after adding deploy/certs/*.pem ----------
    # server {
    #     listen 443 ssl http2;
    #     server_name tripsova.sambhav-surana.online;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #
    #     location /api/ { set $tripsova_backend backend:8010;  proxy_pass http://$tripsova_backend; }
    #     location /     { set $tripsova_frontend frontend:5173; proxy_pass http://$tripsova_frontend; }
    # }
}
