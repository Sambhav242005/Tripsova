# Tripsova reverse proxy.
#
# Routes the public site + API through one host and terminates TLS.
# Enabled via the compose "proxy" profile:  docker compose --profile proxy up -d
#
# Out of the box this serves plain HTTP on :80 (works immediately). To enable
# HTTPS, drop certificates into deploy/certs/ (fullchain.pem + privkey.pem) and
# uncomment the redirect + the TLS server block below.

worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    server_tokens off;
    client_max_body_size 10m;

    # Upstreams (compose service names on the internal network).
    upstream tripsova_frontend { server frontend:5173; }
    upstream tripsova_backend  { server backend:8010; }

    # Shared proxy headers.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- HTTP (:80) -------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # To force HTTPS once certs are in place, comment out the two location
        # blocks below and uncomment this redirect:
        # return 301 https://$host$request_uri;

        location /api/ {
            proxy_pass http://tripsova_backend;
        }
        location / {
            proxy_pass http://tripsova_frontend;
        }
    }

    # ---- HTTPS (:443) — uncomment after adding deploy/certs/*.pem ----------
    # server {
    #     listen 443 ssl http2;
    #     server_name tripsova.com www.tripsova.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #
    #     location /api/ { proxy_pass http://tripsova_backend; }
    #     location /     { proxy_pass http://tripsova_frontend; }
    # }
}
