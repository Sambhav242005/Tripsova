name: Test and deploy to Raspberry Pi

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tripsova-pi-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test backend and build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          # Settings requires JWT_SECRET; tests don't use a real one. This only
          # satisfies config validation at import/collection time.
          JWT_SECRET: ci-test-secret-not-used-for-deploy
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy tested commit on Pi
    needs: test
    runs-on:
      - self-hosted
      - tripsova-pi
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    env:
      REPO_URL: https://github.com/${{ github.repository }}.git

    steps:
      - name: Resolve deploy paths
        shell: bash
        run: |
          set -euo pipefail
          # No GitHub secrets needed: derive everything from the Pi runner's own
          # home directory. The runner user owns these paths.
          echo "DEPLOY_DIR=$HOME/Tripsova" >> "$GITHUB_ENV"
          echo "ENV_FILE=$HOME/.tripsova/deploy.env" >> "$GITHUB_ENV"

      - name: Check out tested commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Sync tested commit
        shell: bash
        run: |
          set -euo pipefail
          runner_user="$(id -un)"
          runner_group="$(id -gn)"
          deploy_parent="$(dirname "$DEPLOY_DIR")"
          sudo install -d -o "$runner_user" -g "$runner_group" "$deploy_parent"

          if [ -e "$DEPLOY_DIR" ] && [ ! -d "$DEPLOY_DIR/.git" ]; then
            backup_dir="${DEPLOY_DIR}.pre-docker.$(date +%Y%m%d%H%M%S)"
            mv "$DEPLOY_DIR" "$backup_dir"
          fi

          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            git clone "$REPO_URL" "$DEPLOY_DIR"
          fi

          git -C "$DEPLOY_DIR" fetch --force origin "$GITHUB_REF_NAME"
          # -f forces the branch switch and discards any local modifications in
          # the working tree (e.g. files hand-edited on the Pi during live
          # debugging). Without it, `checkout` aborts with "local changes would
          # be overwritten" before `reset --hard` ever runs, breaking the deploy.
          git -C "$DEPLOY_DIR" checkout -f -B "$GITHUB_REF_NAME" "$GITHUB_SHA"
          git -C "$DEPLOY_DIR" reset --hard "$GITHUB_SHA"
          git -C "$DEPLOY_DIR" clean -fdx

      - name: Install system packages
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          if [ ! -f deploy/system-packages.txt ]; then
            exit 0
          fi

          mapfile -t packages < <(
            sed -e 's/#.*$//' -e '/^[[:space:]]*$/d' deploy/system-packages.txt
          )

          if [ "${#packages[@]}" -gt 0 ]; then
            sudo apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y "${packages[@]}"
          fi

      - name: Ensure deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          # Generate a persistent JWT secret on first deploy and reuse it forever.
          # Lives outside DEPLOY_DIR so `git clean -fdx` can't wipe it. No GitHub
          # secret required — the Pi owns its own secret.
          mkdir -p "$(dirname "$ENV_FILE")"
          if ! grep -q '^JWT_SECRET=' "$ENV_FILE" 2>/dev/null; then
            umask 077
            echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$ENV_FILE"
          fi
          chmod 600 "$ENV_FILE"

      - name: Retire legacy compose project
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          # Earlier deploys ran compose without --project-name, so it adopted the
          # directory-derived default name "deploy". That stack binds the exact
          # ports the canonical "tripsova" project needs (80/443/5174), and
          # --remove-orphans only cleans within the SAME project — so a stale
          # "deploy" stack would block every deploy. Tear it down if present.
          if sudo docker ps -a --format '{{.Names}}' | grep -q '^deploy-'; then
            sudo docker compose --env-file "$ENV_FILE" -f deploy/docker-compose.yml --project-name deploy down --remove-orphans || true
          fi

      - name: Retire stale Tripova containers
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          # Old manual/partial compose runs can leave containers with canonical
          # names but incomplete compose labels. `up` then cannot create the
          # replacement container and exits with a name conflict. Remove only
          # containers that are not attached to this compose file.
          compose_file="$DEPLOY_DIR/deploy/docker-compose.yml"

          for container in tripsova-db-1 tripsova-backend-1 tripsova-frontend-1 tripsova-nginx-1; do
            if ! sudo docker container inspect "$container" >/dev/null 2>&1; then
              continue
            fi

            project="$(sudo docker inspect -f '{{ index .Config.Labels "com.docker.compose.project" }}' "$container" 2>/dev/null || true)"
            config_files="$(sudo docker inspect -f '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' "$container" 2>/dev/null || true)"
            config_hash="$(sudo docker inspect -f '{{ index .Config.Labels "com.docker.compose.config-hash" }}' "$container" 2>/dev/null || true)"

            if [ "$project" != "tripsova" ] || [ "$config_files" != "$compose_file" ] || [ -z "$config_hash" ] || [ "$config_hash" = "<no value>" ]; then
              sudo docker rm -f "$container"
            fi
          done

      - name: Build and restart Docker stack
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          # --env-file feeds JWT_SECRET into compose interpolation. Works under
          # sudo without -E (no reliance on environment passthrough).
          sudo docker compose --env-file "$ENV_FILE" -f deploy/docker-compose.yml --project-name tripsova up -d --build --remove-orphans
          sudo docker compose --env-file "$ENV_FILE" -f deploy/docker-compose.yml --project-name tripsova ps

      - name: Verify deployed Docker stack
        shell: bash
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:80/ >/dev/null \
              && curl -fsS http://127.0.0.1:80/api/destinations >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:80/ >/dev/null
          curl -fsS http://127.0.0.1:80/api/destinations >/dev/null
          sudo docker compose --env-file "$ENV_FILE" -f deploy/docker-compose.yml --project-name tripsova ps
